name: Quality

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: quality-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    application:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting and lint
              run: npm run check:ci

            - name: Check package boundaries
              run: npm run check:boundaries

            - name: Verify checked-in native artifacts
              run: npm run check:wasm

            # Explicit modes cannot silently pass by falling back from a broken native compiler.
            - name: Typecheck with Rust
              run: npm run typecheck:rust

            - name: Verify Go fallback
              run: npm run typecheck:go

            - name: Verify retained TypeScript fallback
              run: npm run typecheck:legacy

            - name: Run unit tests
              run: npm run test

            - name: Build production application and plugins
              run: npm run build

    rust:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Check Rust formatting
              run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

            - name: Test Rust kernels
              run: cargo test --locked --manifest-path rust/Cargo.toml
